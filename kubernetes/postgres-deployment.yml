apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16 
        envFrom:
          configMapRef:
            - name: app-config
          secretRef:
            - name: app-secret
        ports:
        - containerPort: 5432
